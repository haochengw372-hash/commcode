name: Package checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]' build twine
      - run: python -m pytest
      - run: python -m ruff check src tests examples scripts
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_release.py dist/*
      - run: python examples/offline_demo.py
      - run: commcode --help
