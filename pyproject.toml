[project]
name = "commcode"
version = "0.3.0"
description = "Original-codebook annotation with typed AI judgments and auditable research runs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Haocheng Wang"}, {name = "CommCode contributors"}]
keywords = ["content-analysis", "communication-research", "annotation", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
commcode = "commcode.system1.__main__:main"

[project.urls]
Repository = "https://github.com/haochengw372-hash/commcode"
Issues = "https://github.com/haochengw372-hash/commcode/issues"

[project.optional-dependencies]
llm = ["openai>=2.0"]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["commcode", "commcode.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
